services:
  arcanist.app:
    build:
      context: .
      dockerfile: Dockerfile
    image: "arcanist/app"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - APP_DOMAIN=${APP_DOMAIN:-arcanist.localhost}
      - DB_HOST=mysql
      - DB_DATABASE=${DB_DATABASE:-arcanist_db}
      - DB_USERNAME=${DB_USERNAME:-sail}
      - DB_PASSWORD=${DB_PASSWORD:-password}
    volumes:
      - ".:/var/www/html"
      # On réutilise tes certs si tu es en local Windows/WSL2
      - "/mnt/e/DEV/infrastructure/traefik/certs:/etc/traefik/certs:ro"
    networks:
      - arcanist-network
      - traefik-network
    depends_on:
      - mysql
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.arcanist.rule=Host(`${APP_DOMAIN:-arcanist.localhost}`)"
      - "traefik.http.routers.arcanist.entrypoints=websecure"
      - "traefik.http.routers.arcanist.tls=true"
      - "traefik.http.services.arcanist.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik-network"

  mysql:
    image: "mysql:8.4"
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306" # Port 3307 pour ne pas confiler avec Leasy
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-password}"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: "${DB_DATABASE:-arcanist_db}"
      MYSQL_USER: "${DB_USERNAME:-sail}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-password}"
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    volumes:
      - "arcanist-mysql:/var/lib/mysql"
    networks:
      - arcanist-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD:-password}"]
      retries: 3
      timeout: 5s

  phpmyadmin:
    image: "phpmyadmin:latest"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
    networks:
      - arcanist-network
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.arcanist-pma.rule=Host(`pma-${APP_DOMAIN:-arcanist.localhost}`)"
      - "traefik.http.routers.arcanist-pma.entrypoints=websecure"
      - "traefik.http.routers.arcanist-pma.tls=true"
      - "traefik.http.services.arcanist-pma.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik-network"

networks:
  arcanist-network:
    driver: bridge
  traefik-network:
    external: true

volumes:
  arcanist-mysql:
    driver: local
